controls:
  - id: LNX-NET-001
    cis_ref: "3.1.1"
    title: "Ensure IP forwarding is disabled"
    os: linux
    category: "Network kernel parameters"
    level: 1
    severity: medium
    description: "Stops the kernel from routing packets between interfaces unless the host is a router."
    rationale: "A server that forwards traffic can be used to pivot into other network segments."
    impact: "Routing, VPN or container bridging through this host stops working."
    mitre_attack: ["T1599", "T1090"]
    audit:
      type: sysctl
      command: |-
        sysctl -n net.ipv4.ip_forward
      expected: "0"
      match: equals
    remediation:
      backup:
        - type: file
          path: /etc/sysctl.d/99-hardenops-ip-forward.conf
        - type: sysctl
          name: net.ipv4.ip_forward
      command: |-
        printf 'net.ipv4.ip_forward = 0\n' > /etc/sysctl.d/99-hardenops-ip-forward.conf && sysctl -w net.ipv4.ip_forward=0
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

  - id: LNX-NET-002
    cis_ref: "3.1.2"
    title: "Ensure packet redirect sending is disabled (all interfaces)"
    os: linux
    category: "Network kernel parameters"
    level: 1
    severity: medium
    description: "Stops the host from sending ICMP redirect messages."
    rationale: "Redirects can be abused to steer traffic through an attacker."
    impact: "Few servers depend on sending redirects."
    mitre_attack: ["T1557"]
    audit:
      type: sysctl
      command: |-
        sysctl -n net.ipv4.conf.all.send_redirects
      expected: "0"
      match: equals
    remediation:
      backup:
        - type: file
          path: /etc/sysctl.d/99-hardenops-send-redirects-all.conf
        - type: sysctl
          name: net.ipv4.conf.all.send_redirects
      command: |-
        printf 'net.ipv4.conf.all.send_redirects = 0\n' > /etc/sysctl.d/99-hardenops-send-redirects-all.conf && sysctl -w net.ipv4.conf.all.send_redirects=0
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

  - id: LNX-NET-003
    cis_ref: "3.1.2"
    title: "Ensure packet redirect sending is disabled (default interfaces)"
    os: linux
    category: "Network kernel parameters"
    level: 1
    severity: medium
    description: "Applies the same redirect-sending block to interfaces that appear later."
    rationale: "New interfaces would otherwise inherit the insecure default."
    impact: "Few servers depend on sending redirects."
    mitre_attack: ["T1557"]
    audit:
      type: sysctl
      command: |-
        sysctl -n net.ipv4.conf.default.send_redirects
      expected: "0"
      match: equals
    remediation:
      backup:
        - type: file
          path: /etc/sysctl.d/99-hardenops-send-redirects-default.conf
        - type: sysctl
          name: net.ipv4.conf.default.send_redirects
      command: |-
        printf 'net.ipv4.conf.default.send_redirects = 0\n' > /etc/sysctl.d/99-hardenops-send-redirects-default.conf && sysctl -w net.ipv4.conf.default.send_redirects=0
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

  - id: LNX-NET-004
    cis_ref: "3.2.1"
    title: "Ensure source-routed packets are not accepted (all interfaces)"
    os: linux
    category: "Network kernel parameters"
    level: 1
    severity: high
    description: "Rejects IP packets that specify their own route through the network."
    rationale: "Source routing lets an attacker reach internal hosts through a path the defenders do not control."
    impact: "Very few legitimate networks use source routing."
    mitre_attack: ["T1599", "T1557"]
    audit:
      type: sysctl
      command: |-
        sysctl -n net.ipv4.conf.all.accept_source_route
      expected: "0"
      match: equals
    remediation:
      backup:
        - type: file
          path: /etc/sysctl.d/99-hardenops-source-route-all.conf
        - type: sysctl
          name: net.ipv4.conf.all.accept_source_route
      command: |-
        printf 'net.ipv4.conf.all.accept_source_route = 0\n' > /etc/sysctl.d/99-hardenops-source-route-all.conf && sysctl -w net.ipv4.conf.all.accept_source_route=0
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

