    title: "Ensure source-routed packets are not accepted (default interfaces)"
    os: linux
    category: "Network kernel parameters"
    level: 1
    severity: high
    description: "Applies the source-route rejection to interfaces that appear later."
    rationale: "New interfaces would otherwise accept source-routed packets."
    impact: "Very few legitimate networks use source routing."
    mitre_attack: ["T1599"]
    audit:
      type: sysctl
      command: |-
        sysctl -n net.ipv4.conf.default.accept_source_route
      expected: "0"
      match: equals
    remediation:
      backup:
        - type: file
          path: /etc/sysctl.d/99-hardenops-source-route-default.conf
        - type: sysctl
          name: net.ipv4.conf.default.accept_source_route
      command: |-
        printf 'net.ipv4.conf.default.accept_source_route = 0\n' > /etc/sysctl.d/99-hardenops-source-route-default.conf && sysctl -w net.ipv4.conf.default.accept_source_route=0
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

  - id: LNX-NET-006
    cis_ref: "3.2.2"
    title: "Ensure ICMP redirects are not accepted (all interfaces)"
    os: linux
    category: "Network kernel parameters"
    level: 1
    severity: high
    description: "Ignores ICMP redirect messages that try to change the routing table."
    rationale: "Forged redirects are a classic man-in-the-middle technique."
    impact: "Hosts depending on redirects to find routes may lose connectivity. Rare on servers."
    mitre_attack: ["T1557"]
    audit:
      type: sysctl
      command: |-
        sysctl -n net.ipv4.conf.all.accept_redirects
      expected: "0"
      match: equals
    remediation:
      backup:
        - type: file
          path: /etc/sysctl.d/99-hardenops-accept-redirects-all.conf
        - type: sysctl
          name: net.ipv4.conf.all.accept_redirects
      command: |-
        printf 'net.ipv4.conf.all.accept_redirects = 0\n' > /etc/sysctl.d/99-hardenops-accept-redirects-all.conf && sysctl -w net.ipv4.conf.all.accept_redirects=0
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

