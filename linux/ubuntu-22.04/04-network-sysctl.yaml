    cis_ref: "3.2.2"
    title: "Ensure ICMP redirects are not accepted (default interfaces)"
    os: linux
    category: "Network kernel parameters"
    level: 1
    severity: high
    description: "Applies the redirect rejection to interfaces that appear later."
    rationale: "New interfaces would otherwise accept forged redirects."
    impact: "Rare on servers."
    mitre_attack: ["T1557"]
    audit:
      type: sysctl
      command: |-
        sysctl -n net.ipv4.conf.default.accept_redirects
      expected: "0"
      match: equals
    remediation:
      backup:
        - type: file
          path: /etc/sysctl.d/99-hardenops-accept-redirects-default.conf
        - type: sysctl
