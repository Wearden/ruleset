      strategy: restore_backup
    reboot_required: false
    risky: false

  - id: LNX-SVC-008
    cis_ref: "2.2.14"
    title: "Ensure DNS server (BIND) is disabled"
    os: linux
    category: "Services to disable"
    level: 1
    severity: medium
    description: "Turns off the BIND name server unless this host is a DNS server."
    rationale: "DNS servers accept queries from the network and are a common attack target."
    impact: "This host stops answering DNS queries."
    mitre_attack: ["T1584.002", "T1046"]
    audit:
      type: service
      command: |-
        systemctl is-enabled named 2>/dev/null || systemctl is-enabled bind9 2>/dev/null || true
      expected: "^(disabled|masked|static|not-found|)$"
      match: regex
    remediation:
      backup:
        - type: service
          name: named
      command: |-
        systemctl disable --now named.service bind9.service 2>/dev/null || true; systemctl mask named.service bind9.service 2>/dev/null || true
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

