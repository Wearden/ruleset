    reboot_required: false
    risky: false

  - id: LNX-SVC-012
    cis_ref: "2.3.4"
    title: "Ensure telnet socket is disabled"
    os: linux
    category: "Services to disable"
    level: 1
    severity: high
    description: "Turns off the telnet service socket, which accepts plain-text remote logins."
    rationale: "Telnet sends passwords in clear text. SSH replaces it."
    impact: "Remote telnet logins stop. Use SSH."
    mitre_attack: ["T1021.004", "T1040"]
    audit:
      type: service
      command: |-
        systemctl is-enabled telnet.socket 2>/dev/null || true
      expected: "^(disabled|masked|static|not-found|)$"
      match: regex
    remediation:
      backup:
        - type: service
          name: telnet.socket
      command: |-
        systemctl disable --now telnet.socket 2>/dev/null || true; systemctl mask telnet.socket 2>/dev/null || true
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false
