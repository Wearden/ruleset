controls:
  - id: LNX-SVC-001
    cis_ref: "2.2.3"
    title: "Ensure Avahi daemon is disabled"
    os: linux
    category: "Services to disable"
    level: 1
    severity: low
    description: "Turns off Avahi, the zero-configuration network discovery service."
    rationale: "Discovery services advertise the host and expose extra protocol handling."
    impact: "Local name discovery (mDNS) stops working on the host."
    mitre_attack: ["T1046", "T1557"]
    audit:
      type: service
      command: |-
        systemctl is-enabled avahi-daemon 2>/dev/null || true
      expected: "^(disabled|masked|static|not-found|)$"
      match: regex
    remediation:
      backup:
        - type: service
          name: avahi-daemon
      command: |-
        systemctl disable --now avahi-daemon.service avahi-daemon.socket 2>/dev/null || true; systemctl mask avahi-daemon.service avahi-daemon.socket 2>/dev/null || true
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

  - id: LNX-SVC-002
    cis_ref: "2.2.4"
    title: "Ensure CUPS printing service is disabled"
    os: linux
    category: "Services to disable"
    level: 1
    severity: low
    description: "Turns off the CUPS print server."
    rationale: "A print server listening on the network is unneeded attack surface."
    impact: "Printing from this host stops working."
    mitre_attack: ["T1210"]
    audit:
      type: service
      command: |-
        systemctl is-enabled cups 2>/dev/null || true
      expected: "^(disabled|masked|static|not-found|)$"
      match: regex
    remediation:
      backup:
        - type: service
          name: cups
      command: |-
        systemctl disable --now cups.service cups.socket 2>/dev/null || true; systemctl mask cups.service 2>/dev/null || true
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

  - id: LNX-SVC-003
    cis_ref: "2.2.5"
    title: "Ensure DHCP server is disabled"
    os: linux
    category: "Services to disable"
    level: 1
    severity: medium
    description: "Turns off the ISC DHCP server, which should only run on dedicated DHCP hosts."
    rationale: "A rogue DHCP server can redirect traffic for every client on the segment."
    impact: "This host can no longer hand out DHCP leases."
    mitre_attack: ["T1557"]
    audit:
      type: service
      command: |-
        systemctl is-enabled isc-dhcp-server 2>/dev/null || true
      expected: "^(disabled|masked|static|not-found|)$"
      match: regex
    remediation:
      backup:
        - type: service
          name: isc-dhcp-server
      command: |-
        systemctl disable --now isc-dhcp-server.service 2>/dev/null || true; systemctl mask isc-dhcp-server.service 2>/dev/null || true
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

