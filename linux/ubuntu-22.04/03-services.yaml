    category: "Services to disable"
    level: 1
    severity: medium
    description: "Turns off the RPC portmapper, which older NFS and NIS services depend on."
    rationale: "rpcbind exposes a port-mapping service that enumerators probe for."
    impact: "NFS and NIS clients on this host will not work."
    mitre_attack: ["T1046"]
    audit:
      type: service
      command: |-
        systemctl is-enabled rpcbind 2>/dev/null || true
      expected: "^(disabled|masked|static|not-found|)$"
      match: regex
    remediation:
      backup:
        - type: service
          name: rpcbind
      command: |-
        systemctl disable --now rpcbind.service rpcbind.socket 2>/dev/null || true; systemctl mask rpcbind.service 2>/dev/null || true
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

  - id: LNX-SVC-007
    cis_ref: "2.2.9"
    title: "Ensure rsync service is disabled"
    os: linux
    category: "Services to disable"
    level: 1
    severity: low
    description: "Turns off the rsync daemon. Scheduled rsync over SSH is not affected."
    rationale: "The rsync daemon offers unauthenticated file access unless configured carefully."
    impact: "Hosts that serve files over the rsync protocol stop doing so."
    mitre_attack: ["T1039"]
    audit:
      type: service
      command: |-
        systemctl is-enabled rsync 2>/dev/null || true
      expected: "^(disabled|masked|static|not-found|)$"
      match: regex
    remediation:
      backup:
        - type: service
          name: rsync
      command: |-
        systemctl disable --now rsync.service 2>/dev/null || true; systemctl mask rsync.service 2>/dev/null || true
