    title: "Ensure xinetd super-server is not installed or disabled"
    os: linux
    category: "Services to disable"
    level: 1
    severity: medium
    description: "Turns off the legacy xinetd super-server that starts network services on demand."
    rationale: "xinetd hosts legacy services such as telnet and rsh, which send data in clear text."
    impact: "Services configured through xinetd stop."
    mitre_attack: ["T1021.004"]
    audit:
      type: service
      command: |-
        systemctl is-enabled xinetd 2>/dev/null || true
      expected: "^(disabled|masked|static|not-found|)$"
      match: regex
    remediation:
      backup:
        - type: service
          name: xinetd
      command: |-
        systemctl disable --now xinetd.service 2>/dev/null || true; systemctl mask xinetd.service 2>/dev/null || true
