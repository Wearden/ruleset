  - id: LNX-PAM-007
    cis_ref: "5.3.3.3.1"
    title: "Ensure password reuse is limited (remember the last 5 passwords)"
    os: linux
    category: "PAM and password policy"
    level: 1
    severity: medium
    description: "Stops users re-using one of their five most recent passwords."
    rationale: "Password reuse lets a leaked old password work again."
    impact: "Users cannot cycle between a few favourite passwords."
    mitre_attack: ["T1110.001"]
    audit:
      type: command
      command: |-
        grep -E 'pam_pwhistory' /etc/pam.d/common-password 2>/dev/null | grep -o 'remember=[0-9]*' | cut -d= -f2 | tail -n 1
      expected: "5"
      match: numeric_gte
    remediation:
      backup:
        - type: file
          path: /etc/pam.d/common-password
      command: |-
        f=/etc/pam.d/common-password; grep -q pam_pwhistory $f || sed -i '/pam_unix.so/i password required pam_pwhistory.so use_authtok remember=5' $f; sed -i -E '/pam_pwhistory/ s/remember=[0-9]+/remember=5/' $f
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: true

  - id: LNX-PAM-008
    cis_ref: "5.3.3.1.2"
    title: "Ensure account lockout after repeated failed logins (faillock deny 5 or less)"
    os: linux
    category: "PAM and password policy"
    level: 1
    severity: high
    description: "Locks an account for a period after five failed login attempts."
    rationale: "Lockout stops online password guessing against individual accounts."
    impact: "Attackers and forgetful users alike get locked out for the lock period. Check that the administrator account can still be unlocked before enabling this."
    mitre_attack: ["T1110.001", "T1110.003"]
    audit:
      type: command
      command: |-
        sed -n 's/^[[:space:]]*deny[[:space:]]*=[[:space:]]*//p' /etc/security/faillock.conf 2>/dev/null | tail -n 1
      expected: "5"
      match: numeric_lte
    remediation:
      backup:
        - type: file
          path: /etc/security/faillock.conf
      command: |-
        printf 'deny = 5\nunlock_time = 900\n' > /etc/security/faillock.conf
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: true

  - id: LNX-PAM-009
    cis_ref: "5.4.1.1"
    title: "Ensure password expiration is 365 days or less"
    os: linux
    category: "PAM and password policy"
    level: 1
    severity: low
    description: "Requires passwords to be changed at least once a year."
    rationale: "Limits how long a stolen password stays useful."
    impact: "Users must change passwords yearly. Service accounts may need an exception."
    mitre_attack: ["T1078"]
    audit:
      type: command
      command: |-
        awk '$1=="PASS_MAX_DAYS"{print $2}' /etc/login.defs 2>/dev/null | tail -n 1
      expected: "365"
      match: numeric_lte
    remediation:
      backup:
        - type: file
          path: /etc/login.defs
      command: |-
        sed -i -E 's/^PASS_MAX_DAYS[[:space:]]+.*/PASS_MAX_DAYS   365/' /etc/login.defs
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

  - id: LNX-PAM-010
    cis_ref: "5.4.1.2"
    title: "Ensure minimum days between password changes is 1 or more"
    os: linux
    category: "PAM and password policy"
    level: 1
    severity: low
    description: "Stops users changing their password repeatedly to get back to a favourite one."
    rationale: "Pairs with the reuse limit so the history check cannot be bypassed."
    impact: "Users must wait a day between password changes."
    mitre_attack: ["T1110.001"]
    audit:
      type: command
      command: |-
        awk '$1=="PASS_MIN_DAYS"{print $2}' /etc/login.defs 2>/dev/null | tail -n 1
      expected: "1"
      match: numeric_gte
    remediation:
      backup:
        - type: file
          path: /etc/login.defs
      command: |-
        sed -i -E 's/^PASS_MIN_DAYS[[:space:]]+.*/PASS_MIN_DAYS   1/' /etc/login.defs
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false
