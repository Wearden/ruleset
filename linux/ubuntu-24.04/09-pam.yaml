controls:
  - id: LNX-PAM-001
    cis_ref: "5.3.3.1.1"
    title: "Ensure password quality checking (libpam-pwquality) is installed"
    os: linux
    category: "PAM and password policy"
    level: 1
    severity: medium
    description: "Installs the library that rejects weak passwords when they are set."
    rationale: "Without a quality check, users choose easily guessed passwords."
    impact: "Users must choose stronger passwords when they change them."
    mitre_attack: ["T1110.001", "T1078"]
    audit:
      type: command
      command: |-
        dpkg-query -W -f='${Status}' libpam-pwquality 2>/dev/null || echo missing
      expected: "install ok installed"
      match: equals
    remediation:
      backup:
        - type: command
          path: "dpkg-query -W libpam-pwquality"
      command: |-
        DEBIAN_FRONTEND=noninteractive apt-get install -y libpam-pwquality
    rollback:
      strategy: command
      command: |-
        DEBIAN_FRONTEND=noninteractive apt-get remove -y libpam-pwquality
    reboot_required: false
    risky: false

  - id: LNX-PAM-002
    cis_ref: "5.3.3.2.2"
    title: "Ensure minimum password length is 14 characters"
    os: linux
    category: "PAM and password policy"
    level: 1
    severity: high
    description: "Requires new passwords to be at least 14 characters long."
    rationale: "Length is the strongest single defence against password guessing and cracking."
    impact: "Users with shorter passwords must change them at their next password change."
    mitre_attack: ["T1110.002", "T1078"]
    audit:
      type: command
      command: |-
        sed -n 's/^[[:space:]]*minlen[[:space:]]*=[[:space:]]*//p' /etc/security/pwquality.conf 2>/dev/null | tail -n 1
      expected: "14"
      match: numeric_gte
    remediation:
      backup:
        - type: file
          path: /etc/security/pwquality.conf
      command: |-
        f=/etc/security/pwquality.conf; grep -q '^[[:space:]]*minlen' $f && sed -i 's/^[[:space:]]*minlen.*/minlen = 14/' $f || echo 'minlen = 14' >> $f
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

  - id: LNX-PAM-003
    cis_ref: "5.3.3.2.3"
    title: "Ensure passwords require at least one digit"
    os: linux
    category: "PAM and password policy"
    level: 1
    severity: low
    description: "Requires at least one digit in new passwords."
    rationale: "Character-class rules raise the cost of brute-force guessing."
    impact: "Users must include a digit when they change passwords."
    mitre_attack: ["T1110.002"]
    audit:
      type: command
      command: |-
        sed -n 's/^[[:space:]]*dcredit[[:space:]]*=[[:space:]]*//p' /etc/security/pwquality.conf 2>/dev/null | tail -n 1
      expected: "-1"
      match: numeric_lte
    remediation:
      backup:
        - type: file
          path: /etc/security/pwquality.conf
      command: |-
        f=/etc/security/pwquality.conf; grep -q '^[[:space:]]*dcredit' $f && sed -i 's/^[[:space:]]*dcredit.*/dcredit = -1/' $f || echo 'dcredit = -1' >> $f
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

