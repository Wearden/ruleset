    level: 1
    severity: medium
    description: "Ignores IPv6 router advertisements."
    rationale: "Rogue advertisements can redirect traffic or configure hostile addresses."
    impact: "Hosts using automatic IPv6 configuration lose it and need static addresses."
    mitre_attack: ["T1557"]
    audit:
      type: sysctl
      command: |-
        sysctl -n net.ipv6.conf.all.accept_ra
      expected: "0"
      match: equals
    remediation:
      backup:
        - type: file
          path: /etc/sysctl.d/99-wearden-LNX-NET-024.conf
        - type: sysctl
          name: net.ipv6.conf.all.accept_ra
      command: |-
        printf 'net.ipv6.conf.all.accept_ra = 0\n' > /etc/sysctl.d/99-wearden-LNX-NET-024.conf && sysctl -w net.ipv6.conf.all.accept_ra=0
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: true
