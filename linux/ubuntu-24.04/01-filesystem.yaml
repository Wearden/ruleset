controls:
  - id: LNX-FS-001
    cis_ref: "1.1.1.1"
    title: "Ensure cramfs kernel module is disabled"
    os: linux
    category: "Filesystem and mount options"
    level: 1
    severity: low
    description: "Blocks loading of the cramfs filesystem driver, which the system does not need."
    rationale: "Unused kernel filesystem code is attack surface that an unprivileged user can reach."
    impact: "Mounting cramfs images fails. Standard servers do not use cramfs."
    mitre_attack: ["T1547.006"]
    audit:
      type: command
      command: |-
        modprobe -n -v cramfs 2>&1 | grep -c 'install /bin/true'
      expected: "1"
      match: equals
    remediation:
      backup:
        - type: file
          path: /etc/modprobe.d/hardenops-cramfs.conf
      command: |-
        printf 'install cramfs /bin/true\n' > /etc/modprobe.d/hardenops-cramfs.conf && (rmmod cramfs 2>/dev/null || true)
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

