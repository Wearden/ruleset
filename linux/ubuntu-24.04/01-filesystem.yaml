  - id: LNX-FS-009
    cis_ref: "1.1.2.1"
    title: "Ensure nodev, nosuid and noexec are set on /tmp"
    os: linux
    category: "Filesystem and mount options"
    level: 1
    severity: medium
    description: "Mounts /tmp so that device files, setuid binaries and executables cannot run from it."
    rationale: "/tmp is world-writable, so it is the most common place for staged attack payloads."
    impact: "Programs that execute code from /tmp will fail. /tmp must be a separate mount, or the change lasts only until reboot."
    mitre_attack: ["T1564", "T1204"]
    audit:
      type: command
      command: |-
        o=$(findmnt -kn -o OPTIONS /tmp 2>/dev/null); for x in nodev nosuid noexec; do case ",$o," in *,$x,*) ;; *) echo missing-$x; exit 0;; esac; done; echo ok
      expected: "ok"
      match: equals
    remediation:
      backup:
        - type: file
          path: /etc/fstab
      command: |-
        sed -i -E '\#[[:space:]]/tmp[[:space:]]#s/defaults/defaults,nodev,nosuid,noexec/' /etc/fstab && mount -o remount,nodev,nosuid,noexec /tmp
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

  - id: LNX-FS-010
    cis_ref: "1.1.7"
    title: "Ensure nodev, nosuid and noexec are set on /dev/shm"
    os: linux
    category: "Filesystem and mount options"
    level: 1
    severity: medium
    description: "Mounts the shared-memory filesystem so that it cannot hold device files, setuid binaries or executables."
    rationale: "Shared memory is writable by everyone and is a common staging area."
    impact: "Software that maps executable code from shared memory will stop working. Rare on servers."
    mitre_attack: ["T1564"]
    audit:
      type: command
      command: |-
        o=$(findmnt -kn -o OPTIONS /dev/shm 2>/dev/null); for x in nodev nosuid noexec; do case ",$o," in *,$x,*) ;; *) echo missing-$x; exit 0;; esac; done; echo ok
      expected: "ok"
      match: equals
    remediation:
      backup:
        - type: file
          path: /etc/fstab
      command: |-
        sed -i -E '\#[[:space:]]/dev/shm[[:space:]]#s/defaults/defaults,nodev,nosuid,noexec/' /etc/fstab && mount -o remount,nodev,nosuid,noexec /dev/shm
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false
