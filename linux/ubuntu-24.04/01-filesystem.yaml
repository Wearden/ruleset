  - id: LNX-FS-006
    cis_ref: "1.1.4"
    title: "Ensure nodev, nosuid and noexec are set on /var/tmp"
    os: linux
    category: "Filesystem and mount options"
    level: 1
    severity: medium
    description: "Mounts /var/tmp so that device files, setuid binaries and executables cannot run from it."
    rationale: "Attackers often stage payloads in temporary directories. These flags block the common tricks."
    impact: "Scripts or installers that run from /var/tmp will stop working. /var/tmp must be a separate mount, or the change is only applied at runtime."
    mitre_attack: ["T1564", "T1204"]
    audit:
      type: command
      command: |-
        o=$(findmnt -kn -o OPTIONS /var/tmp 2>/dev/null); for x in nodev nosuid noexec; do case ",$o," in *,$x,*) ;; *) echo missing-$x; exit 0;; esac; done; echo ok
      expected: "ok"
      match: equals
    remediation:
      backup:
        - type: file
          path: /etc/fstab
      command: |-
        sed -i -E '\#[[:space:]]/var/tmp[[:space:]]#s/defaults/defaults,nodev,nosuid,noexec/' /etc/fstab && mount -o remount,nodev,nosuid,noexec /var/tmp
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

