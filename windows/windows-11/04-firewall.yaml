controls:
  - id: WIN-FW-001
    cis_ref: "9.1.1"
    title: "Ensure Windows Defender Firewall is on for the Domain profile"
    os: windows
    category: "Windows Defender Firewall"
    level: 1
    severity: high
    description: "Turns on the host firewall while the machine is on a domain network."
    rationale: "A host firewall limits which services an attacker on the segment can reach."
    impact: "Remote management ports are blocked unless allowed. The remediation enables the WinRM and RDP rules first."
    mitre_attack: ["T1562.004", "T1046"]
    audit:
      type: command
      command: |-
        (Get-NetFirewallProfile -Name Domain).Enabled
      expected: "True"
      match: equals
    remediation:
      backup:
        - type: netfirewall
          name: Domain
      command: |-
        Enable-NetFirewallRule -DisplayGroup 'Windows Remote Management','Remote Desktop' -ErrorAction SilentlyContinue; Set-NetFirewallProfile -Name Domain -Enabled True
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: true

