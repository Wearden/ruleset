  - id: WIN-FW-004
    cis_ref: "9.1.2"
    title: "Ensure inbound connections are blocked by default on the Domain profile"
    os: windows
    category: "Windows Defender Firewall"
    level: 1
    severity: high
    description: "Drops inbound connections that have no allow rule, on domain networks."
    rationale: "Default-deny means only deliberately published services are reachable."
    impact: "Any inbound service without an allow rule stops. WinRM and RDP are allowed before this change is applied."
    mitre_attack: ["T1562.004", "T1021"]
    audit:
      type: command
      command: |-
        (Get-NetFirewallProfile -Name Domain).DefaultInboundAction
      expected: "Block"
      match: equals
    remediation:
      backup:
        - type: netfirewall
          name: Domain
      command: |-
        Enable-NetFirewallRule -DisplayGroup 'Windows Remote Management','Remote Desktop' -ErrorAction SilentlyContinue; Set-NetFirewallProfile -Name Domain -DefaultInboundAction Block
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: true

