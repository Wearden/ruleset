  - id: WIN-FW-009
    cis_ref: "9.3.3"
    title: "Ensure the Public firewall log is at least 16 MB"
    os: windows
    category: "Windows Defender Firewall"
    level: 1
    severity: low
    description: "Makes the public-profile firewall log large enough to keep useful history."
    rationale: "A tiny log rotates away the evidence of an attack within minutes."
    impact: "Uses up to 16 MB of disk for the firewall log."
    mitre_attack: ["T1070"]
    audit:
      type: command
      command: |-
        (Get-NetFirewallProfile -Name Public).LogMaxSizeKilobytes
      expected: "16384"
      match: numeric_gte
    remediation:
      backup:
        - type: netfirewall
          name: Public
      command: |-
        Set-NetFirewallProfile -Name Public -LogMaxSizeKilobytes 16384
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false
