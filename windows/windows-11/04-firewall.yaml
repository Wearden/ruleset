  - id: WIN-FW-007
    cis_ref: "9.1.6"
    title: "Ensure dropped packets are logged on the Domain profile"
    os: windows
    category: "Windows Defender Firewall"
    level: 1
    severity: medium
    description: "Writes blocked inbound connections to the firewall log on domain networks."
    rationale: "Blocked connection logs reveal scanning and attack attempts."
    impact: "Log file grows with blocked traffic."
    mitre_attack: ["T1562.002", "T1595"]
    audit:
      type: command
      command: |-
        (Get-NetFirewallProfile -Name Domain).LogBlocked
      expected: "True"
      match: equals
    remediation:
      backup:
        - type: netfirewall
          name: Domain
      command: |-
        Set-NetFirewallProfile -Name Domain -LogBlocked True
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

