controls:
  - id: WIN-AUD-001
    cis_ref: "17.1.1"
    title: "Ensure 'Audit Credential Validation' is configured"
    os: windows
    category: "Advanced audit policy"
    level: 1
    severity: medium
    description: "Records every attempt to validate account credentials on this machine."
    rationale: "Credential validation events show password guessing and pass-the-hash attempts."
    impact: "Higher security log volume on busy authentication servers."
    mitre_attack: ["T1110", "T1550.002"]
    audit:
      type: auditpol
      command: |-
        (auditpol /get /subcategory:"Credential Validation" /r | ConvertFrom-Csv).'Inclusion Setting'
      expected: "Success and Failure"
      match: equals
    remediation:
      backup:
        - type: auditpol
          name: Credential Validation
      command: |-
        auditpol /set /subcategory:"Credential Validation" /success:enable /failure:enable
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

