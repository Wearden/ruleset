      type: secpol
      command: |-
        $f = Join-Path $env:TEMP 'hardenops-ur.inf'; secedit /export /cfg $f /areas USER_RIGHTS | Out-Null; [regex]::Match((Get-Content $f -Raw), '(?m)^SeImpersonatePrivilege\s*=[^\r\n]*').Value
      expected: "*S-1-5-32-544"
      match: contains
