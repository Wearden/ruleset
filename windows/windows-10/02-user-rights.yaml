    rationale: "Debug rights let a user read or modify the memory of any process, including security tools."
    impact: "Developers who debug other users' processes need an administrator."
    mitre_attack: ["T1003.001", "T1055"]
    audit:
      type: secpol
      command: |-
        $f = Join-Path $env:TEMP 'hardenops-ur.inf'; secedit /export /cfg $f /areas USER_RIGHTS | Out-Null; [regex]::Match((Get-Content $f -Raw), '(?m)^SeDebugPrivilege\s*=[^\r\n]*').Value
      expected: "SeDebugPrivilege = *S-1-5-32-544"
      match: equals
    remediation:
      backup:
        - type: secedit
          path: USER_RIGHTS
      command: |-
        $f = Join-Path $env:TEMP 'hardenops-ur.inf'; $d = Join-Path $env:TEMP 'hardenops.sdb'; secedit /export /cfg $f /areas USER_RIGHTS | Out-Null; $c = Get-Content $f -Raw; $c = [regex]::Replace($c, '(?m)^SeDebugPrivilege\s*=[^\r\n]*', 'SeDebugPrivilege = *S-1-5-32-544'); if ($c -notmatch '(?m)^SeDebugPrivilege') { $c = $c -replace '\[Privilege Rights\]', "[Privilege Rights]`r`nSeDebugPrivilege = *S-1-5-32-544" }; Set-Content -Path $f -Value $c -Encoding Unicode; secedit /configure /db $d /cfg $f /areas USER_RIGHTS /quiet
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

