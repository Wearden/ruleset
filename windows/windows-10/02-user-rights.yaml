  - id: WIN-URA-006
    cis_ref: "2.2.21"
    title: "Ensure 'Act as part of the operating system' is assigned to no account"
    os: windows
    category: "User rights assignment"
    level: 1
    severity: critical
    description: "Removes the right to act as the operating system from every account."
    rationale: "This right lets a process impersonate any user, making it a privilege-escalation shortcut."
    impact: "Few applications need it. Software that does will fail and must be reviewed."
    mitre_attack: ["T1134", "T1068"]
    audit:
      type: secpol
      command: |-
        $f = Join-Path $env:TEMP 'hardenops-ur.inf'; secedit /export /cfg $f /areas USER_RIGHTS | Out-Null; $m = [regex]::Match((Get-Content $f -Raw), '(?m)^SeTcbPrivilege\s*=[^\r\n]*'); if ($m.Success) { $m.Value } else { 'SeTcbPrivilege =' }
      expected: "SeTcbPrivilege ="
      match: equals
    remediation:
      backup:
        - type: secedit
          path: USER_RIGHTS
      command: |-
        $f = Join-Path $env:TEMP 'hardenops-ur.inf'; $d = Join-Path $env:TEMP 'hardenops.sdb'; secedit /export /cfg $f /areas USER_RIGHTS | Out-Null; $c = Get-Content $f -Raw; $c = [regex]::Replace($c, '(?m)^SeTcbPrivilege\s*=[^\r\n]*', 'SeTcbPrivilege = '); if ($c -notmatch '(?m)^SeTcbPrivilege') { $c = $c -replace '\[Privilege Rights\]', "[Privilege Rights]`r`nSeTcbPrivilege = " }; Set-Content -Path $f -Value $c -Encoding Unicode; secedit /configure /db $d /cfg $f /areas USER_RIGHTS /quiet
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

