  - id: WIN-URA-010
    cis_ref: "2.2.3"
    title: "Ensure 'Access this computer from the network' includes Administrators"
    os: windows
    category: "User rights assignment"
    level: 1
    severity: medium
    description: "Makes sure administrators keep network access so remote management still works after hardening."
    rationale: "Removing network logon from administrators would break WinRM and file administration."
    impact: "None when administrators already have this right. This control protects remote management."
    mitre_attack: ["T1021"]
    audit:
      type: secpol
      command: |-
        $f = Join-Path $env:TEMP 'hardenops-ur.inf'; secedit /export /cfg $f /areas USER_RIGHTS | Out-Null; [regex]::Match((Get-Content $f -Raw), '(?m)^SeNetworkLogonRight\s*=[^\r\n]*').Value
      expected: "*S-1-5-32-544"
      match: contains
    remediation:
      backup:
        - type: secedit
          path: USER_RIGHTS
      command: |-
        $f = Join-Path $env:TEMP 'hardenops-ur.inf'; $d = Join-Path $env:TEMP 'hardenops.sdb'; secedit /export /cfg $f /areas USER_RIGHTS | Out-Null; $c = Get-Content $f -Raw; $c = [regex]::Replace($c, '(?m)^SeNetworkLogonRight\s*=[^\r\n]*', 'SeNetworkLogonRight = *S-1-5-32-544,*S-1-5-11,*S-1-5-32-545'); if ($c -notmatch '(?m)^SeNetworkLogonRight') { $c = $c -replace '\[Privilege Rights\]', "[Privilege Rights]`r`nSeNetworkLogonRight = *S-1-5-32-544,*S-1-5-11,*S-1-5-32-545" }; Set-Content -Path $f -Value $c -Encoding Unicode; secedit /configure /db $d /cfg $f /areas USER_RIGHTS /quiet
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: true

