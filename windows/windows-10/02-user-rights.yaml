controls:
  - id: WIN-URA-001
    cis_ref: "2.2.20"
    title: "Ensure 'Deny access to this computer from the network' includes Guests"
    os: windows
    category: "User rights assignment"
    level: 1
    severity: medium
    description: "Stops guest accounts from connecting to this machine over the network."
    rationale: "Guest network access gives unidentified attackers a route in."
    impact: "Guests cannot use network shares on this machine."
    mitre_attack: ["T1078.001", "T1021.002"]
    audit:
      type: secpol
      command: |-
        $f = Join-Path $env:TEMP 'hardenops-ur.inf'; secedit /export /cfg $f /areas USER_RIGHTS | Out-Null; [regex]::Match((Get-Content $f -Raw), '(?m)^SeDenyNetworkLogonRight\s*=[^\r\n]*').Value
      expected: "*S-1-5-32-546"
      match: contains
    remediation:
      backup:
        - type: secedit
          path: USER_RIGHTS
      command: |-
        $f = Join-Path $env:TEMP 'hardenops-ur.inf'; $d = Join-Path $env:TEMP 'hardenops.sdb'; secedit /export /cfg $f /areas USER_RIGHTS | Out-Null; $c = Get-Content $f -Raw; $c = [regex]::Replace($c, '(?m)^SeDenyNetworkLogonRight\s*=[^\r\n]*', 'SeDenyNetworkLogonRight = *S-1-5-32-546'); if ($c -notmatch '(?m)^SeDenyNetworkLogonRight') { $c = $c -replace '\[Privilege Rights\]', "[Privilege Rights]`r`nSeDenyNetworkLogonRight = *S-1-5-32-546" }; Set-Content -Path $f -Value $c -Encoding Unicode; secedit /configure /db $d /cfg $f /areas USER_RIGHTS /quiet
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

