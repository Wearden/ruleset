          path: USER_RIGHTS
      command: |-
        $f = Join-Path $env:TEMP 'hardenops-ur.inf'; $d = Join-Path $env:TEMP 'hardenops.sdb'; secedit /export /cfg $f /areas USER_RIGHTS | Out-Null; $c = Get-Content $f -Raw; $c = [regex]::Replace($c, '(?m)^SeImpersonatePrivilege\s*=[^\r\n]*', 'SeImpersonatePrivilege = *S-1-5-32-544,*S-1-5-19,*S-1-5-20,*S-1-5-6'); if ($c -notmatch '(?m)^SeImpersonatePrivilege') { $c = $c -replace '\[Privilege Rights\]', "[Privilege Rights]`r`nSeImpersonatePrivilege = *S-1-5-32-544,*S-1-5-19,*S-1-5-20,*S-1-5-6" }; Set-Content -Path $f -Value $c -Encoding Unicode; secedit /configure /db $d /cfg $f /areas USER_RIGHTS /quiet
