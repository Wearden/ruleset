controls:
  - id: WIN-PWD-001
    cis_ref: "1.1.5"
    title: "Ensure minimum password length is 14 characters or more"
    os: windows
    category: "Password and account lockout policy"
    level: 1
    severity: high
    description: "Requires local and domain passwords to be at least 14 characters."
    rationale: "Length is the strongest defence against password guessing and offline cracking."
    impact: "Users with shorter passwords must change them at the next change."
    mitre_attack: ["T1110.002", "T1078"]
    audit:
      type: command
      command: |-
        $m = [regex]::Match((net accounts | Out-String), 'Minimum password length:\s+(\d+)'); $m.Groups[1].Value
      expected: "14"
      match: numeric_gte
    remediation:
      backup:
        - type: netaccounts
      command: |-
        net accounts /minpwlen:14
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

  - id: WIN-PWD-002
    cis_ref: "1.1.5"
    title: "Ensure password complexity requirements are enabled"
    os: windows
    category: "Password and account lockout policy"
    level: 1
    severity: high
    description: "Requires new passwords to mix letter cases, digits and symbols and not contain the account name."
    rationale: "Complexity rules block the most common guessable passwords."
    impact: "Users must choose more complex passwords at the next change."
    mitre_attack: ["T1110.001"]
    audit:
      type: secpol
      command: |-
        $f = Join-Path $env:TEMP 'hardenops-secpol.inf'; secedit /export /cfg $f /areas SECURITYPOLICY | Out-Null; [regex]::Match((Get-Content $f -Raw), 'PasswordComplexity\s*=\s*(\d+)').Groups[1].Value
      expected: "1"
      match: equals
    remediation:
      backup:
        - type: secedit
          path: SECURITYPOLICY
      command: |-
        $f = Join-Path $env:TEMP 'hardenops-secpol.inf'; $d = Join-Path $env:TEMP 'hardenops.sdb'; secedit /export /cfg $f /areas SECURITYPOLICY | Out-Null; $c = Get-Content $f -Raw; $c = [regex]::Replace($c, 'PasswordComplexity\s*=\s*\d+', 'PasswordComplexity = 1'); Set-Content -Path $f -Value $c -Encoding Unicode; secedit /configure /db $d /cfg $f /areas SECURITYPOLICY /quiet
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

  - id: WIN-PWD-003
    cis_ref: "1.2.2"
    title: "Ensure account lockout threshold is 5 invalid attempts or fewer"
    os: windows
    category: "Password and account lockout policy"
    level: 1
    severity: high
    description: "Locks an account after five failed sign-in attempts."
    rationale: "Lockout stops online password guessing against each account."
    impact: "Attackers and forgetful users both get locked out. The built-in Administrator account must stay usable for recovery. Check that before enabling."
    mitre_attack: ["T1110.001", "T1110.003"]
    audit:
      type: command
      command: |-
        $m = [regex]::Match((net accounts | Out-String), 'Lockout threshold:\s+(\S+)'); if ($m.Groups[1].Value -eq 'Never') { 999 } else { $m.Groups[1].Value }
      expected: "5"
      match: numeric_lte
    remediation:
      backup:
        - type: netaccounts
      command: |-
        net accounts /lockoutthreshold:5
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: true

  - id: WIN-PWD-004
    cis_ref: "1.2.1"
    title: "Ensure account lockout duration is 15 minutes or more"
    os: windows
    category: "Password and account lockout policy"
    level: 1
    severity: medium
    description: "Keeps a locked account locked for at least 15 minutes."
    rationale: "A short lockout lets an attacker retry on a schedule."
    impact: "Users locked out must wait 15 minutes or ask an administrator."
    mitre_attack: ["T1110.003"]
    audit:
      type: command
      command: |-
        $m = [regex]::Match((net accounts | Out-String), 'Lockout duration \(minutes\):\s+(\S+)'); if ($m.Groups[1].Value -eq 'Never') { 99999 } else { $m.Groups[1].Value }
      expected: "15"
      match: numeric_gte
    remediation:
      backup:
        - type: netaccounts
      command: |-
        net accounts /lockoutduration:15
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

  - id: WIN-PWD-005
    cis_ref: "1.2.3"
    title: "Ensure lockout counter resets after 15 minutes or more"
    os: windows
    category: "Password and account lockout policy"
    level: 1
    severity: low
    description: "Counts failed sign-ins within a 15-minute window before lockout."
    rationale: "A short reset window lets slow guessing go unnoticed."
    impact: "Failed attempts are remembered longer, so users who mistype often may lock out sooner."
    mitre_attack: ["T1110.001"]
    audit:
      type: command
      command: |-
        $m = [regex]::Match((net accounts | Out-String), 'Lockout observation window \(minutes\):\s+(\S+)'); $m.Groups[1].Value
      expected: "15"
      match: numeric_gte
    remediation:
      backup:
        - type: netaccounts
      command: |-
        net accounts /lockoutwindow:15
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

  - id: WIN-PWD-006
    cis_ref: "1.1.2"
    title: "Ensure maximum password age is 60 days or less"
    os: windows
    category: "Password and account lockout policy"
    level: 1
    severity: medium
    description: "Requires passwords to be changed at least every 60 days."
    rationale: "Limits how long a leaked password stays useful."
    impact: "Users change passwords more often. Service accounts may need an exception."
    mitre_attack: ["T1078"]
    audit:
      type: command
      command: |-
        $m = [regex]::Match((net accounts | Out-String), 'Maximum password age \(days\):\s+(\S+)'); if ($m.Groups[1].Value -eq 'Unlimited') { 99999 } else { $m.Groups[1].Value }
      expected: "60"
      match: numeric_lte
    remediation:
      backup:
        - type: netaccounts
      command: |-
        net accounts /maxpwage:60
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

  - id: WIN-PWD-007
    cis_ref: "1.1.3"
    title: "Ensure minimum password age is 1 day or more"
    os: windows
    category: "Password and account lockout policy"
    level: 1
    severity: low
    description: "Stops users changing their password repeatedly to get back to an old one."
    rationale: "Pairs with the password history rule so it cannot be bypassed."
    impact: "Users must wait a day between password changes."
    mitre_attack: ["T1110.001"]
    audit:
      type: command
      command: |-
        $m = [regex]::Match((net accounts | Out-String), 'Minimum password age \(days\):\s+(\d+)'); $m.Groups[1].Value
      expected: "1"
      match: numeric_gte
    remediation:
      backup:
        - type: netaccounts
      command: |-
        net accounts /minpwage:1
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

  - id: WIN-PWD-008
    cis_ref: "1.1.1"
    title: "Ensure password history remembers 24 passwords"
    os: windows
    category: "Password and account lockout policy"
    level: 1
    severity: medium
    description: "Prevents users reusing any of their last 24 passwords."
    rationale: "Reuse lets a leaked password work again after a forced change."
    impact: "Users cannot reuse recent passwords."
    mitre_attack: ["T1110.001"]
    audit:
      type: secpol
      command: |-
        $f = Join-Path $env:TEMP 'hardenops-secpol.inf'; secedit /export /cfg $f /areas SECURITYPOLICY | Out-Null; [regex]::Match((Get-Content $f -Raw), 'PasswordHistorySize\s*=\s*(\d+)').Groups[1].Value
      expected: "24"
      match: numeric_gte
    remediation:
      backup:
        - type: secedit
          path: SECURITYPOLICY
      command: |-
        $f = Join-Path $env:TEMP 'hardenops-secpol.inf'; $d = Join-Path $env:TEMP 'hardenops.sdb'; secedit /export /cfg $f /areas SECURITYPOLICY | Out-Null; $c = Get-Content $f -Raw; $c = [regex]::Replace($c, 'PasswordHistorySize\s*=\s*\d+', 'PasswordHistorySize = 24'); Set-Content -Path $f -Value $c -Encoding Unicode; secedit /configure /db $d /cfg $f /areas SECURITYPOLICY /quiet
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

  - id: WIN-PWD-009
    cis_ref: "1.1.6"
    title: "Ensure reversible password encryption is disabled"
    os: windows
    category: "Password and account lockout policy"
    level: 1
    severity: critical
    description: "Stores passwords only as one-way hashes, not in a form that can be decrypted."
    rationale: "Reversible storage lets anyone with the directory database recover every password."
    impact: "Applications that need the plain password (some legacy digest logins) break."
    mitre_attack: ["T1003.002", "T1003.003"]
    audit:
      type: secpol
      command: |-
        $f = Join-Path $env:TEMP 'hardenops-secpol.inf'; secedit /export /cfg $f /areas SECURITYPOLICY | Out-Null; [regex]::Match((Get-Content $f -Raw), 'ClearTextPassword\s*=\s*(\d+)').Groups[1].Value
      expected: "0"
      match: equals
    remediation:
      backup:
        - type: secedit
          path: SECURITYPOLICY
      command: |-
        $f = Join-Path $env:TEMP 'hardenops-secpol.inf'; $d = Join-Path $env:TEMP 'hardenops.sdb'; secedit /export /cfg $f /areas SECURITYPOLICY | Out-Null; $c = Get-Content $f -Raw; $c = [regex]::Replace($c, 'ClearTextPassword\s*=\s*\d+', 'ClearTextPassword = 0'); Set-Content -Path $f -Value $c -Encoding Unicode; secedit /configure /db $d /cfg $f /areas SECURITYPOLICY /quiet
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

  - id: WIN-PWD-010
    cis_ref: "2.3.1.1"
    title: "Ensure the Guest account is disabled"
    os: windows
    category: "Password and account lockout policy"
    level: 1
    severity: medium
    description: "Disables the built-in Guest account, which allows sign-in without a personal password."
    rationale: "Guest accounts give unidentified access and are a common foothold."
    impact: "Nobody can sign in as Guest. Normal users are not affected."
    mitre_attack: ["T1078.001"]
    audit:
      type: command
      command: |-
        $u = Get-LocalUser -Name Guest -ErrorAction SilentlyContinue; if ($u) { $u.Enabled } else { 'False' }
      expected: "False"
      match: equals
    remediation:
      backup:
        - type: localuser
          name: Guest
      command: |-
        Disable-LocalUser -Name Guest
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false
