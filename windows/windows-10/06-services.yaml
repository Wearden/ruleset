      match: equals
    remediation:
      backup:
        - type: service
          name: SNMP
      command: |-
        Stop-Service -Name SNMP -Force -ErrorAction SilentlyContinue; Set-Service -Name SNMP -StartupType Disabled
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false

