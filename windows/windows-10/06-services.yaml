  - id: WIN-SVC-006
    cis_ref: "5.6"
    title: "Ensure Simple TCP/IP Services (echo, daytime, chargen) is disabled"
    os: windows
    category: "Services"
    level: 1
    severity: medium
    description: "Turns off the legacy diagnostic services that answer on fixed TCP ports."
    rationale: "These services are used for reflection and amplification attacks and reveal system details."
    impact: "Legacy diagnostic clients stop working."
    mitre_attack: ["T1498", "T1046"]
    audit:
      type: service
      command: |-
        $s = Get-Service -Name simptcp -ErrorAction SilentlyContinue; if ($s) { $s.StartType } else { 'Disabled' }
      expected: "Disabled"
      match: equals
    remediation:
      backup:
        - type: service
          name: simptcp
      command: |-
        Stop-Service -Name simptcp -Force -ErrorAction SilentlyContinue; Set-Service -Name simptcp -StartupType Disabled
    rollback:
      strategy: restore_backup
    reboot_required: false
    risky: false
